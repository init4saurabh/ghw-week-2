<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake — GHW Week 2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <h1>Snake</h1>
        <p class="meta">Global Hack Week · Week 2</p>
        <div class="scores">
          <div>
            Score
            <strong id="score">0</strong>
          </div>
          <div>
            Best
            <strong id="best">0</strong>
          </div>
        </div>
      </header>

      <div class="board-wrap">
        <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlay-title">Ready?</p>
          <p id="overlay-hint">Use arrow keys or WASD. Press Space to start.</p>
        </div>
      </div>

      <div class="controls" aria-label="On-screen controls">
        <button type="button" data-dir="up">↑</button>
        <div class="row">
          <button type="button" data-dir="left">←</button>
          <button type="button" data-dir="down">↓</button>
          <button type="button" data-dir="right">→</button>
        </div>
      </div>

      <p class="help">
        Eat food, grow longer, don’t hit the walls or yourself.
        Space pauses. Enter restarts after game over.
      </p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
